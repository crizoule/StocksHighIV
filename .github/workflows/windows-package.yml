name: Windows package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3 cryptography==50.0.1
      - run: python -m unittest discover -s tests -q
      - run: python packaging/windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-package
          path: dist/windows/StocksHighIV-Windows.zip
          if-no-files-found: error
